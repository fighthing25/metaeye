[package]
name = "venom-island"
version = "1.0.0"
edition = "2021"
description = "Venom Island - Dynamic Island untuk Windows"
authors = ["Venom Island"]
license = "MIT"

[dependencies]
eframe = "0.27"
egui = "0.27"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
arboard = "2.0"
ureq = "2.10"
qrcode = "0.13"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
